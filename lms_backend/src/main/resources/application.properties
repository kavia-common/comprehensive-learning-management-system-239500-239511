spring.application.name=lmsbackend

server.port=3001

# ----------------------------
# PostgreSQL configuration
# ----------------------------
# Required environment variables (provided via container .env / orchestration):
# POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB, POSTGRES_PORT.
#
# NOTE: The lms_database container's db_connection.txt uses:
#   postgresql://appuser:...@localhost:5000/myapp
# These defaults mirror that layout while still allowing orchestration to override.
spring.datasource.url=jdbc:postgresql://${POSTGRES_URL:localhost}:${POSTGRES_PORT:5000}/${POSTGRES_DB:myapp}
spring.datasource.username=${POSTGRES_USER:appuser}
spring.datasource.password=${POSTGRES_PASSWORD:dbuser123}
spring.datasource.driver-class-name=org.postgresql.Driver

# ----------------------------
# JPA / Hibernate
# ----------------------------
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ----------------------------
# Flyway
# ----------------------------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ----------------------------
# Actuator
# ----------------------------
management.endpoints.web.exposure.include=health,info,metrics

# ----------------------------
# Swagger/OpenAPI
# ----------------------------
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# Respect X-Forwarded-* / Forwarded headers so redirects preserve external scheme/host/port
server.forward-headers-strategy=framework

# ----------------------------
# JWT
# ----------------------------
# Required env vars:
# LMS_JWT_SECRET (base64 or raw string), LMS_JWT_ACCESS_TTL_SECONDS, LMS_JWT_REFRESH_TTL_SECONDS
lms.jwt.secret=${LMS_JWT_SECRET}
lms.jwt.access-ttl-seconds=${LMS_JWT_ACCESS_TTL_SECONDS:900}
lms.jwt.refresh-ttl-seconds=${LMS_JWT_REFRESH_TTL_SECONDS:1209600}

# ----------------------------
# CORS (comma-separated). Optional.
# Example: http://localhost:3000,https://your-frontend
# ----------------------------
lms.cors.allowed-origins=${LMS_CORS_ALLOWED_ORIGINS:${ALLOWED_ORIGINS:*}}
